[project]
name = "retailpulse-360"
version = "0.1.0"
description = "Modern Data Warehouse pour le retail omnicanal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.67",
    "faker==40.36.0",
    "fastapi>=0.141.1",
    "polars>=1.43.2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0,<2.1",
    "structlog>=24.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=ingestion --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "data",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
