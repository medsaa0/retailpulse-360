name: retailpulse-360

services:
  postgres:
    image: postgres:16.14-alpine
    container_name: retailpulse-postgres
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - retailpulse_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - retailpulse_network

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: retailpulse-minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - retailpulse_minio_data:/data

    networks:
      - retailpulse_network

volumes:
  retailpulse_postgres_data:
    name: retailpulse_postgres_data

  retailpulse_minio_data:
    name: retailpulse_minio_data

networks:
  retailpulse_network:
    name: retailpulse_network
    driver: bridge
