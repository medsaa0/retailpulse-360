name: retailpulse-360

services:

  # ============================================================
  # POSTGRESQL - Base de données source
  # ============================================================
  postgres:
    image: postgres:16.14-alpine
    container_name: retailpulse-postgres
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - retailpulse_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - retailpulse_network


  # ============================================================
  # MINIO - Object Storage
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: retailpulse-minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - retailpulse_minio_data:/data

    networks:
      - retailpulse_network


  # ============================================================
  # DELIVERY API - FastAPI
  # ============================================================
  delivery-api:
    build:
      context: .
      dockerfile: delivery_api/Dockerfile
    container_name: retailpulse-delivery-api
    restart: unless-stopped

    ports:
      - "8002:8002"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - retailpulse_network


  # ============================================================
  # POSTGRESQL - Airflow Metadata Database
  # ============================================================
  airflow-postgres:
    image: postgres:16.14-alpine
    container_name: retailpulse-airflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - retailpulse_airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - retailpulse_network


  # ============================================================
  # AIRFLOW INIT
  # Initialise la base Airflow et crée l'utilisateur admin
  # ============================================================
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: retailpulse-airflow-init

    depends_on:
      airflow-postgres:
        condition: service_healthy

      delivery-api:
        condition: service_healthy

    environment: &airflow-env

      # ----------------------------
      # Airflow
      # ----------------------------
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ""

      PYTHONPATH: /opt/airflow/project

      # ----------------------------
      # PostgreSQL projet
      # ----------------------------
      POSTGRES_HOST: retailpulse-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # ----------------------------
      # MinIO
      # ----------------------------
      MINIO_ENDPOINT: http://retailpulse-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}

      # ----------------------------
      # Delivery API
      # ----------------------------
      DELIVERY_API_BASE_URL: http://retailpulse-delivery-api:8002

      # ----------------------------
      # Snowflake
      # ----------------------------
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}

    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - .:/opt/airflow/project

    entrypoint: /bin/bash

    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@retailpulse.local

    networks:
      - retailpulse_network


  # ============================================================
  # AIRFLOW WEBSERVER
  # ============================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: retailpulse-airflow-webserver
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    ports:
      - "8080:8080"

    command: airflow webserver

    networks:
      - retailpulse_network


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: retailpulse-airflow-scheduler
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env

    volumes: *airflow-volumes

    command: airflow scheduler

    networks:
      - retailpulse_network


# ==============================================================
# VOLUMES
# ==============================================================
volumes:

  retailpulse_postgres_data:
    name: retailpulse_postgres_data

  retailpulse_minio_data:
    name: retailpulse_minio_data

  retailpulse_airflow_postgres_data:
    name: retailpulse_airflow_postgres_data


# ==============================================================
# NETWORK
# ==============================================================
networks:

  retailpulse_network:
    name: retailpulse_network
    driver: bridge