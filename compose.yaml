name: retailpulse-360

services:
  postgres:
    image: postgres:16.14-alpine
    container_name: retailpulse-postgres
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - retailpulse_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - retailpulse_network

volumes:
  retailpulse_postgres_data:
    name: retailpulse_postgres_data

networks:
  retailpulse_network:
    name: retailpulse_network
    driver: bridge
