name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Installer Python
        run: uv python install 3.12

      - name: Installer les dépendances
        run: uv sync --all-groups

      - name: Lint avec Ruff
        run: uv run ruff check .

      - name: Vérifier le formatage
        run: uv run ruff format --check .

      - name: Lancer les tests unitaires
        run: uv run pytest --ignore=tests/unit/test_dags.py

  dbt-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Installer Python
        run: uv python install 3.12

      - name: Installer les dépendances
        run: uv sync --all-groups

      - name: Installer les packages dbt
        working-directory: dbt_retailpulse
        run: uv run dbt deps

      - name: Vérifier la syntaxe dbt
        working-directory: dbt_retailpulse
        run: uv run dbt parse
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/dbt_ci_profile
          SNOWFLAKE_ACCOUNT: dummy-account
          SNOWFLAKE_USER: dummy-user
          SNOWFLAKE_ROLE: SYSADMIN
          SNOWFLAKE_WAREHOUSE: dummy-wh
          SNOWFLAKE_DATABASE: RETAILPULSE

  airflow-dag-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Installer Python
        run: uv python install 3.12

      - name: Installer les dépendances
        run: uv sync --all-groups

      - name: Vérifier que les DAGs se parsent sans erreur
        run: |
          uv run python -c "
          from airflow.models import DagBag

          bag = DagBag(
              dag_folder='airflow/dags',
              include_examples=False,
          )

          assert bag.import_errors == {}, bag.import_errors
          print('DAGs OK:', list(bag.dags.keys()))
          "

      - name: Tester les DAGs
        run: uv run pytest tests/unit/test_dags.py

  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scanner les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}